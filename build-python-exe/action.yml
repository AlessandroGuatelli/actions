name: 'Build Python to EXE'
description: 'Compila uno script Python in un file eseguibile (.exe) usando PyInstaller'
inputs:
  python-version:
    description: 'Versione di Python da utilizzare'
    required: false
    default: '3.12'
  script-name:
    description: 'Nome dello script Python principale'
    required: false
    default: 'main.py'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      shell: bash
      run: pyinstaller --onefile ${{ inputs.script-name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Eseguibile
        path: dist/*.exe