name: 'Build Python to EXE'
description: 'Compila in EXE con supporto requirements.txt e certificati SSL'
inputs:
  python-version:
    description: 'Versione di Python'
    required: false
    default: '3.12'
  script-name:
    description: 'Script principale'
    required: false
    default: 'main.py'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller certifi
        
        if [ -f "requirements.txt" ]; then
          echo "Trovato requirements.txt"
          pip install -r requirements.txt
        fi

    - name: Build EXE
      shell: bash
      run: pyinstaller --onefile --collect-all certifi ${{ inputs.script-name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Eseguibile
        path: dist/*.exe
