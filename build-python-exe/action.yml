name: 'Build Python to EXE'
description: 'Compila uno script Python in un file eseguibile (.exe) con supporto automatico per requirements.txt e certificati SSL'
inputs:
  python-version:
    description: 'Versione di Python da utilizzare'
    required: false
    default: '3.12'
  script-name:
    description: 'Nome dello script Python principale'
    required: false
    default: 'main.py'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies automatically
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller certifi
        
        # Controlla se esiste un requirements.txt nel repository del progetto
        if [ -f "requirements.txt" ]; then
          echo "==> Trovato requirements.txt, installazione dipendenze in corso..."
          pip install -r requirements.txt
        else
          echo "==> Nessun requirements.txt trovato. Verrà usato solo PyInstaller."
        fi

    - name: Build EXE with PyInstaller
      shell: bash
      run: pyinstaller --onefile --collect-all certifi ${{ inputs.script-name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-Eseguibile
        path: dist/*.exename: 'Build Python to EXE'
