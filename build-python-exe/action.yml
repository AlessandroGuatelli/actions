name: 'Build Python to EXE'
description: 'Compila in EXE con supporto requirements.txt, certificati SSL, e Release integrata'
inputs:
  python-version:
    description: 'Versione di Python'
    required: false
    default: '3.12'
  script-name:
    description: 'Nome dello script principale (verrà cercato in tutto il repository)'
    required: false
    default: 'main.py'
  artifact-name:
    description: 'Nome del pacchetto Artifact da generare'
    required: false
    default: 'App-Eseguibile'
  create-release:
    description: 'Flag booleano: se "true", crea una GitHub Release'
    required: false
    default: 'false'
  tag-name:
    description: 'Il nome del tag per la release (necessario se create-release è true)'
    required: false
    default: ''
  github-token:
    description: 'GITHUB_TOKEN necessario per pubblicare la release'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Ricerca ricorsiva dello script
      id: locate-script
      shell: bash
      run: |
        # Cerca il file in tutto il repository e restituisce il primo match
        SCRIPT_PATH=$(find . -name "${{ inputs.script-name }}" -type f | head -n 1)
        
        if [ -z "$SCRIPT_PATH" ]; then
          echo "Errore critico: Script '${{ inputs.script-name }}' non trovato in nessuna directory."
          exit 1
        fi
        
        echo "Script individuato al percorso: $SCRIPT_PATH"
        echo "script_path=$SCRIPT_PATH" >> $GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller certifi
        
        SCRIPT_DIR=$(dirname "${{ steps.locate-script.outputs.script_path }}")
        
        # Cerca i requirements prima nella directory dello script, poi nella root
        if [ -f "$SCRIPT_DIR/requirements.txt" ]; then
          echo "Trovato requirements.txt nella directory dello script: $SCRIPT_DIR"
          pip install -r "$SCRIPT_DIR/requirements.txt"
        elif [ -f "requirements.txt" ]; then
          echo "Trovato requirements.txt nella root del progetto"
          pip install -r requirements.txt
        else
          echo "Nessun file requirements.txt trovato, installazione ignorata."
        fi

    - name: Build EXE
      shell: bash
      # L'eseguibile verrà generato nella cartella /dist
      run: pyinstaller --onefile --collect-all certifi "${{ steps.locate-script.outputs.script_path }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/*.exe
        retention-days: 30

    - name: Pubblica nelle GitHub Releases
      # Questo step viene eseguito solo se il chiamante imposta create-release a 'true'
      if: ${{ inputs.create-release == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag-name }}
        files: dist/*.exe
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        # I segreti vanno mappati esplicitamente alle variabili d'ambiente
        GITHUB_TOKEN: ${{ inputs.github-token }}
